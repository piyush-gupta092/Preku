name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol codegen up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node protocol/codegen/generate.mjs --check

  skills:
    name: Skills valid
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node skills/tools/validate.mjs skills/examples/*.json
      - name: Shared skills (named after their id)
        shell: bash
        run: |
          shopt -s nullglob
          files=(skills/community/*.json)
          if (( ${#files[@]} )); then node skills/tools/validate.mjs --name-is-id "${files[@]}"; fi

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

      - name: cargo fmt
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test (also regenerates ts-rs bindings)
        working-directory: desktop/src-tauri
        run: cargo test
      - name: ts-rs bindings committed
        shell: bash
        run: git diff --exit-code -- src/lib/types/generated

      - name: Build app (no installer)
        run: pnpm tauri build --debug --no-bundle

  cli:
    name: preku CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  android:
    name: Android
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Lint, unit tests, build both flavors
        run: gradle lint testPlayDebugUnitTest testFullDebugUnitTest assembleDebug
